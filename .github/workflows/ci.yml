name: ci

on:
  push:
    branches: [main]
  pull_request:

# No permissions by default. Each job asks for exactly what it uses.
permissions: {}

# A new push cancels the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    # `macos-26` pins the image instead of following `macos-latest`, which changes Xcode version
    # without warning and turns someone else's build break into ours.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # `step-security/harden-runner` is not used here: it blocks outbound traffic only on Linux
      # runners. On macOS it does nothing, and a defence that does not defend is worse than
      # none, because it gets cited as if it did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment versions
        run: |
          swift --version
          xcodebuild -version

      # Through `make` and not `swift build` directly: the Makefile is what the README documents
      # and where toolchain resolution lives. Here, with no swiftly installed, it exercises the
      # fallback branch (whatever `swift` is on PATH, i.e. the runner's Xcode).
      - name: Build
        run: make build

      # The suite belongs to `CentinelaCore`, which imports neither AppKit nor SwiftUI: it runs
      # with no graphics session. That is why the package is split into two targets.
      - name: Test
        run: make test

      - name: Assemble the app bundle
        run: make app

      # Building is not proof the bundle is right. This is: without `LSUIElement` the app would
      # show up in the Dock, and without a signature it will not launch on a Mac with Gatekeeper.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          plutil -lint build/Centinela.app/Contents/Info.plist
          test "$(plutil -extract LSUIElement raw build/Centinela.app/Contents/Info.plist)" = "true"
          test -x build/Centinela.app/Contents/MacOS/Centinela
          codesign --verify --verbose=2 build/Centinela.app

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Centinela-app
          path: build/Centinela.app
          retention-days: 7

  without-xcode:
    # The README promises this builds with `swiftly` and no Xcode. A promise like that rots
    # quietly: someone adds `import XCTest` or a type that only ships with Xcode's SDK, and
    # nobody finds out until another person clones the repository on a clean machine. This job
    # keeps it honest.
    name: build with swiftly only
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install swiftly and a toolchain
        run: |
          set -euo pipefail
          brew install swiftly
          swiftly init --assume-yes --skip-install --no-modify-profile
          swiftly install 6.3.3 --use --assume-yes

      # The runner image DOES ship Xcode. Without checking which compiler ended up active, this
      # job would pass green using exactly what it claims not to need, and the README's promise
      # would have no guard. Hence the toolchain name is verified before building: swiftly's
      # identifies itself as `swift-X.Y.Z-RELEASE`, Xcode's as `swiftlang-…`.
      - name: Build and test without Xcode
        run: |
          set -euo pipefail
          export PATH="$HOME/.swiftly/bin:$PATH"
          swift --version
          swift --version | grep -q 'swift-6\.3\.3-RELEASE' \
            || { echo "::error::the active compiler is NOT swiftly's"; exit 1; }
          # Through `make`, which is the path the README tells people to use and where toolchain
          # resolution lives. Running `swift build` directly here would leave untested exactly
          # the path that was fixed (swiftly's proxy resolves differently under make).
          make toolchain
          make build
          make test

  lint:
    name: swiftlint
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: brew install swiftlint
      - run: swiftlint lint --quiet --strict

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public and the whole project is about a token. A Sentry organization
      # token starts with `sntrys_`; a user one with `sntryu_`.
      - name: No Sentry token in the tree
        run: |
          set -euo pipefail
          if grep -rInE 'sntry[su]_[A-Za-z0-9_=-]{10,}' --exclude-dir=.git .; then
            echo "::error::something shaped like a Sentry token is in the repository"
            exit 1
          fi

      # The fixtures get published. Real responses carry error titles with internal URLs and
      # business data; the ones here are invented and have to stay that way.
      #
      # The pattern looks for the real organization, NOT the string `sentry.io`: the fixtures use
      # `example.sentry.io` on purpose, so the permalink has the true shape. A guard against
      # `sentry.io` alone would fire on correct fixtures, which is the fastest way to get a guard
      # switched off.
      - name: The fixtures carry no real data
        run: |
          set -euo pipefail
          if grep -rInE 'bioalergia|doctoralia|[0-9]{7,8}-[0-9kK]' Tests/CentinelaCoreTests/Fixtures/; then
            echo "::error::a fixture carries a real name or something shaped like a national ID"
            exit 1
          fi
