name: ci

on:
  push:
    branches: [main]
    # The release workflow commits `appcast.xml` back to main. Without this, publishing a version
    # triggers a second full run of everything, macOS runners included, over a file no test reads.
    paths-ignore:
      - appcast.xml
      - CHANGELOG.md
  pull_request:
  schedule:
    # Mondays 07:00 UTC, for the without-Xcode guard below.
    - cron: "0 7 * * 1"
  workflow_dispatch:

# No permissions by default. Each job asks for exactly what it uses.
permissions: {}

# A new push cancels the previous run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    # `macos-26` pins the image instead of following `macos-latest`, which changes Xcode version
    # without warning and turns someone else's build break into ours.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # `step-security/harden-runner` is not used here: it blocks outbound traffic only on Linux
      # runners. On macOS it does nothing, and a defence that does not defend is worse than
      # none, because it gets cited as if it did.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Environment versions
        run: |
          swift --version
          xcodebuild -version

      # Through `make` and not `swift build` directly: the Makefile is what the README documents
      # and where toolchain resolution lives. Here, with no swiftly installed, it exercises the
      # fallback branch (whatever `swift` is on PATH, i.e. the runner's Xcode).
      - name: Build
        run: make build

      # The suite belongs to `CentinelaCore`, which imports neither AppKit nor SwiftUI: it runs
      # with no graphics session. That is why the package is split into two targets.
      - name: Test
        run: make test

      # swiftlint runs here rather than in a job of its own. It needs macOS, and macOS runners
      # are the scarce resource: with one job per check, two of the four sat queued for over ten
      # minutes while the Linux job finished in five seconds. The tree is already checked out.
      - name: Lint
        run: |
          brew install swiftlint
          swiftlint lint --quiet --strict

      - name: Assemble the app bundle
        run: make app

      # Building is not proof the bundle is right. This is: without `LSUIElement` the app would
      # show up in the Dock, and without a signature it will not launch on a Mac with Gatekeeper.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          plutil -lint build/Centinela.app/Contents/Info.plist
          test "$(plutil -extract LSUIElement raw build/Centinela.app/Contents/Info.plist)" = "true"
          test -x build/Centinela.app/Contents/MacOS/Centinela
          codesign --verify --verbose=2 build/Centinela.app

      # The disk image is only built when a tag is pushed, which means a break in it would be
      # found by a release rather than by a push. Building it here costs seconds and moves that
      # discovery to the commit that caused it.
      - name: The disk image assembles, and carries the bundle that was verified
        run: |
          set -euo pipefail
          make dmg

          # `diskutil` rather than `hdiutil` throughout. On macOS 26 `hdiutil` says of itself
          # that it is deprecated and names these as the replacements, and this job pins a 26
          # runner, so there is no older machine to fall back for. The Makefile keeps a fallback
          # because somebody may build on 14; a workflow that chooses its own runner does not.
          #
          # Attaching is the verification. A disk image with a bad checksum does not mount, and
          # `--mountPoint` means nothing has to be parsed out of the output to find where it did.
          # The directory has to exist first: `diskutil` refuses with "Mount point ... doesn't
          # exist" rather than creating it. Verified locally against a path that happened to
          # exist already, which is why the runner found this and the laptop did not.
          mount="$RUNNER_TEMP/centinela-dmg"
          mkdir -p "$mount"
          diskutil image attach --readOnly --nobrowse --mountPoint "$mount" build/Centinela.dmg

          # `make dmg` deliberately does not rebuild, so the copy inside the image has to be the
          # same bytes the checks above just looked at. If that stops being true, the guards
          # would be vouching for one artifact while people download another.
          verified=$(codesign -dvvv build/Centinela.app 2>&1 | awk -F= '/^CDHash/{print $2; exit}')
          shipped=$(codesign -dvvv "$mount/Centinela.app" 2>&1 | awk -F= '/^CDHash/{print $2; exit}')
          diskutil eject "$mount" >/dev/null
          echo "verified $verified"
          echo "shipped  $shipped"
          test -n "$verified" && test "$verified" = "$shipped" \
            || { echo "::error::the disk image does not carry the bundle that was verified"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Centinela-app
          path: build/Centinela.app
          retention-days: 7

  without-xcode:
    # The README promises this builds with `swiftly` and no Xcode. A promise like that rots
    # quietly: someone adds `import XCTest` or a type that only ships with Xcode's SDK, and
    # nobody finds out until another person clones the repository on a clean machine. This job
    # keeps it honest.
    #
    # Weekly rather than on every push. What it guards against arrives with a dependency or an
    # import, not with a commit, and it costs a macOS runner: while it queued for ten minutes,
    # the checks that do gate a change were waiting behind it. `workflow_dispatch` is there for
    # the day someone touches the toolchain on purpose.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    name: build with swiftly only
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install swiftly and a toolchain
        run: |
          set -euo pipefail
          brew install swiftly
          swiftly init --assume-yes --skip-install --no-modify-profile
          swiftly install 6.3.3 --use --assume-yes

      # The runner image DOES ship Xcode. Without checking which compiler ended up active, this
      # job would pass green using exactly what it claims not to need, and the README's promise
      # would have no guard. Hence the toolchain name is verified before building: swiftly's
      # identifies itself as `swift-X.Y.Z-RELEASE`, Xcode's as `swiftlang-…`.
      - name: Build and test without Xcode
        run: |
          set -euo pipefail
          export PATH="$HOME/.swiftly/bin:$PATH"
          swift --version
          swift --version | grep -q 'swift-6\.3\.3-RELEASE' \
            || { echo "::error::the active compiler is NOT swiftly's"; exit 1; }
          # Through `make`, which is the path the README tells people to use and where toolchain
          # resolution lives. Running `swift build` directly here would leave untested exactly
          # the path that was fixed (swiftly's proxy resolves differently under make).
          make toolchain
          make build
          make test


  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository is public and the whole project is about a token. A Sentry organization
      # token starts with `sntrys_`; a user one with `sntryu_`.
      - name: No Sentry token in the tree
        run: |
          set -euo pipefail
          if grep -rInE 'sntry[su]_[A-Za-z0-9_=-]{10,}' --exclude-dir=.git .; then
            echo "::error::something shaped like a Sentry token is in the repository"
            exit 1
          fi

      # The fixtures get published. Real responses carry error titles with internal URLs and
      # business data; the ones here are invented and have to stay that way.
      #
      # The pattern looks for the real organization, NOT the string `sentry.io`: the fixtures use
      # `example.sentry.io` on purpose, so the permalink has the true shape. A guard against
      # `sentry.io` alone would fire on correct fixtures, which is the fastest way to get a guard
      # switched off.
      - name: The fixtures carry no real data
        run: |
          set -euo pipefail
          if grep -rInE 'bioalergia|doctoralia|[0-9]{7,8}-[0-9kK]' Tests/CentinelaCoreTests/Fixtures/; then
            echo "::error::a fixture carries a real name or something shaped like a national ID"
            exit 1
          fi
