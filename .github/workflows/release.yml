name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `make app` takes the version from `git describe`, which needs the tags.
          fetch-depth: 0

      # Released builds are signed with the same certificate local builds use. That is not
      # cosmetic: with an ad-hoc signature the designated requirement is the code hash, so every
      # update looks like a different application to the Keychain and macOS asks the user for
      # their password. Measured: 7709 ms and a dialog with ad-hoc, 18 ms and none with a stable
      # identity. A release signed ad-hoc would put the dialog back for everyone who updates.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE_P12:-}" ]; then
            echo "::error::SIGNING_CERTIFICATE_P12 is not set: the release would be ad-hoc signed"
            exit 1
          fi
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          # A keychain of its own, deleted at the end of the job. The runner's login keychain is
          # not somewhere to leave a private key.
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 900 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -A
          # Without this, codesign blocks on a dialog nobody can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')

          # The certificate has to be TRUSTED, not merely present. `security find-identity -v`
          # lists valid identities only, and a self-signed certificate is not valid until the
          # system trusts it for code signing, so without this the Makefile finds nothing and
          # silently falls back to ad-hoc. The next step catches that, but this is the fix.
          # Trust is scoped to code signing with `-p codeSign`, not granted for everything.
          openssl pkcs12 -in <(echo "$CERTIFICATE_P12" | base64 --decode) \
            -passin "pass:$CERTIFICATE_PASSWORD" -clcerts -nokeys -out certificate.pem -legacy
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain certificate.pem
          rm -f certificate.p12 certificate.pem

          security find-identity -v -p codesigning | tee identities.txt
          grep -q "Centinela Signing" identities.txt \
            || { echo "::error::the certificate imported but is not a valid signing identity"; exit 1; }

      - name: Build and bundle
        run: make app

      # The whole point of the certificate is that the requirement stops being a hash. If a
      # release ever goes out ad-hoc, everyone who updates gets a password dialog and nobody
      # would connect it to this job.
      - name: The signature is identity-based, not a hash
        run: |
          set -euo pipefail
          REQUIREMENT=$(codesign -d -r- build/Centinela.app 2>&1 | tail -1)
          echo "$REQUIREMENT"
          case "$REQUIREMENT" in
            *cdhash*) echo "::error::signed ad-hoc: the designated requirement is a code hash"; exit 1 ;;
            *"certificate root"*) echo "identity-based, good" ;;
            *) echo "::error::unrecognised designated requirement"; exit 1 ;;
          esac

      # Building is not proof the bundle is right. This is: without `LSUIElement` the app would
      # show up in the Dock, and without a signature it will not launch past Gatekeeper.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          plutil -lint build/Centinela.app/Contents/Info.plist
          test "$(plutil -extract LSUIElement raw build/Centinela.app/Contents/Info.plist)" = "true"
          codesign --verify --verbose=2 build/Centinela.app

      # The version in the bundle has to match the tag being published. Without this check a
      # mistyped tag ships an artifact that says something else, and nobody notices until an
      # update check compares the wrong numbers.
      - name: The bundle version matches the tag
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw build/Centinela.app/Contents/Info.plist)"
          echo "tag=$TAG_VERSION bundle=$BUNDLE_VERSION"
          test "$TAG_VERSION" = "$BUNDLE_VERSION" \
            || { echo "::error::the tag says $TAG_VERSION and the bundle says $BUNDLE_VERSION"; exit 1; }

      # `ditto` and not `zip`: it preserves the extended attributes and symlinks of the bundle.
      # A `.app` compressed with `zip` loses its signature and macOS refuses to open it.
      - name: Compress
        run: ditto -c -k --keepParent build/Centinela.app build/Centinela.zip

      # The notes are assembled here rather than with `--generate-notes` alone. The CHANGELOG
      # section says WHY the change matters; the generated list says WHAT changed, with links.
      # Both go in, in that order.
      - name: Assemble the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # `index($0, v) == 1` rather than a regular expression: the brackets in "## [0.2.0]"
          # would be read as a character class and the section would come out empty.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          # Without this, a CHANGELOG missing this version's section would publish a release
          # with an empty body and nobody would find out until they read it.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section." >&2
            exit 1
          fi

          # Kept on its own before the install instructions and the generated PR list are
          # appended: the appcast embeds this half, and the in-app dialog should show what
          # changed, not how to unzip.
          cp notes.md changelog-section.md

          {
            echo
            echo "## Installing"
            echo
            echo "Unzip, drag to Applications, and the first time open it with right click, Open."
            echo "The signature is ad-hoc and not notarized, so Gatekeeper asks once. Notarizing"
            echo "costs 99 USD a year and does not pay for itself here."
            echo
            echo '    codesign -dv --verbose=4 Centinela.app'
            echo '    spctl -a -t exec -vvv Centinela.app'
            echo
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" --jq .body
          } >> notes.md

      # Sparkle verifies updates with an EdDSA signature of ours, not with an Apple certificate.
      # That is the whole reason automatic updates work here despite the ad-hoc code signature.
      # The private key lives only in this secret; the public half is in `Info.plist`.
      - name: Sign the archive for Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set: the update would be unverifiable"
            exit 1
          fi
          VERSION_TAG=$(curl -sL https://api.github.com/repos/sparkle-project/Sparkle/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${VERSION_TAG}/Sparkle-${VERSION_TAG}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xJf sparkle.tar.xz -C sparkle
          SIGN=$(find sparkle -name sign_update -type f -not -path '*old_dsa*' | head -1)
          # `--ed-key-file` and not `-s`: passing the key as an argument is deprecated and
          # `sign_update` exits 1 on it. The file is written with restrictive permissions and
          # removed in the same step.
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > sparkle-key
          "$SIGN" --ed-key-file sparkle-key build/Centinela.zip > signature.txt
          rm -f sparkle-key
          # The signature goes to a file rather than a step output: it is short, but keeping it
          # off the step summary is free.
          grep -q 'sparkle:edSignature="' signature.txt \
            || { echo "::error::sign_update produced no signature"; exit 1; }
          echo "signed ok"

      - name: Update the appcast
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="$(plutil -extract CFBundleVersion raw build/Centinela.app/Contents/Info.plist)"
          python3 Tools/appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Centinela.zip" \
            --signature "$(cat signature.txt)" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --notes-file changelog-section.md

      # `gh release` ships with the runner. A third-party action for this would be supply-chain
      # surface with nothing to show for it.
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain build.keychain || true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            build/Centinela.zip

      # Committed AFTER publishing on purpose: if the release failed, the feed must not point at
      # an archive that does not exist. Sparkle would download a 404 and report it as a broken
      # update to every user.
      - name: Commit the appcast
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git diff --cached --quiet && { echo "appcast unchanged"; exit 0; }
          # `[skip ci]` and not only `paths-ignore` in ci.yml: CodeQL runs through GitHub's
          # default setup, which has no path filter to configure. The marker in the message is
          # the one thing both honour.
          git commit -m "chore(appcast): $GITHUB_REF_NAME [skip ci]"
          git push origin HEAD:main
