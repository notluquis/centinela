name: mutación

# Semanal y a mano, nunca en cada PR: una corrida de mutación tarda mucho más que la suite y
# su resultado no es un sí/no, es una lista para leer.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutacion
  cancel-in-progress: true

jobs:
  mutar:
    # `macos-26` y no una máquina sin Xcode: muter NO compila sin Xcode. Falla con
    # `no such module 'XCTest'`, exactamente el mismo muro que obligó a que la suite de este
    # proyecto use Swift Testing. Por eso la mutación vive en CI y no en el flujo local.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar muter
        run: brew install muter-mutation-testing/formulae/muter

      - name: Mutar
        # Sin `--format xcode`: se quiere el informe legible, no anotaciones en el diff.
        run: muter run --output-json muter-informe.json || true

      # `|| true` arriba deja pasar el caso en que muter no corrió, se cayó o rechazó
      # `muter.conf.yml`. Ese archivo NO se pudo validar en local (muter no compila sin Xcode),
      # así que una clave mal escrita mutaría todo o nada, y el job saldría verde igual.
      # Esto lo hace ruidoso sin bloquear ningún PR: el job es semanal.
      - name: El informe existe y tiene mutantes
        run: |
          set -euo pipefail
          test -s muter-informe.json || { echo "::error::muter no dejó informe: revisa muter.conf.yml"; exit 1; }
          mutantes=$(python3 -c "import json;d=json.load(open('muter-informe.json'));print(len(d.get('fileMutations') or d.get('mutationScores') or []))")
          echo "mutantes/archivos en el informe: $mutantes"
          test "$mutantes" -gt 0 || { echo "::error::el informe salió vacío: la configuración no está apuntando al código"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: informe-de-mutacion
          path: muter-informe.json
          retention-days: 30
