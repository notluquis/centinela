name: mutation

# Weekly and on demand, never on every PR: a mutation run takes far longer than the suite and
# its result is not a yes/no, it is a list to read.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutate:
    # `macos-26` and not a machine without Xcode: muter does NOT build without Xcode. It fails
    # with `no such module 'XCTest'`, exactly the same wall that made this project's suite use
    # Swift Testing. That is why mutation lives in CI and not in the local loop.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Muter mutates a COPY of the project and runs `swift test` there, which resolves
      # dependencies from scratch. With nothing in SwiftPM's shared cache that copy tries to
      # clone Sparkle over the network and the first real run died on exactly that: "Failed to
      # clone repository". Resolving here fills the cache the copy then reads.
      - name: Fill SwiftPM's cache before muter copies the project
        run: swift package resolve

      - name: Install muter
        run: brew install muter-mutation-testing/formulae/muter

      - name: Mutate
        # `--format json --output <file>`, which is what `muter run` actually accepts. It was
        # `--output-json`, a flag that does not exist, and the run died with "Unknown option"
        # before mutating anything. Nobody saw it because this workflow had never been run: it is
        # weekly, and it was added days before the first Monday.
        run: |
          muter run --files-to-mutate 'Sources/CentinelaCore/*.swift' \
            --format json --output muter-report.json || true

      # The `|| true` above lets through the case where muter never ran, crashed, or rejected
      # `muter.conf.yml`. That file cannot be validated locally (muter does not build without
      # Xcode), so a misspelled key would mutate everything or nothing and the job would go
      # green regardless. This makes a broken config loud without gating any PR: the job is
      # weekly.
      - name: The report exists and has mutants
        run: |
          set -euo pipefail
          test -s muter-report.json || { echo "::error::muter left no report: check muter.conf.yml"; exit 1; }
          # The report's exact shape cannot be checked here: muter does not build without Xcode,
          # so nobody can run it on a development machine. The guard therefore reads whatever
          # key carries the per-file results and refuses an empty one, rather than depending on
          # a field name that a muter release could rename underneath it.
          python3 - <<'PY'
          import json, sys
          report = json.load(open("muter-report.json"))
          files = (report.get("fileReports") or report.get("fileMutations")
                   or report.get("mutationScores") or [])
          score = report.get("mutationScore", report.get("globalMutationScore"))
          print(f"files mutated: {len(files)}   mutation score: {score}")
          if not files:
              print("::error::the report came out empty: the config is not pointing at the code")
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: muter-report.json
          retention-days: 30
