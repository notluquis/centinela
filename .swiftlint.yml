# Default rules plus a few that matter here. The ones Stats disables out of historical debt are
# not copied over: this project starts clean and it should show when it stops being.
#
# Careful running it locally: swiftlint needs `sourcekitdInProc.framework`, which it looks for
# inside Xcode. Without Xcode it has to be pointed at the swiftly toolchain, and `make lint`
# already does that.
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - implicitly_unwrapped_optional
  - last_where
  - redundant_nil_coalescing
  - toggle_bool

analyzer_rules:
  # Only runs under `swiftlint analyze`, which needs a compile log. Declaring it here rather
  # than in `opt_in_rules` avoids the warning about being in the wrong section.
  - unused_import

disabled_rules:
  - trailing_whitespace
  - todo
  # `force_unwrapping` was tried and removed, not skipped for convenience. All fourteen hits
  # were on literals known at compile time (`URL(string: "https://…")!`), which is exactly the
  # case where a `!` cannot fail. The rule cannot tell a literal from user input, so its only
  # way out was wrapping it in a helper that crashes the same way under a different name, which
  # is worse than not having it. `implicitly_unwrapped_optional`, which stays on, covers the
  # pattern that actually bites: a `T!` property someone reads before assigning it.

identifier_name:
  min_length: 2
  max_length: 50
  # `x`, `y` are coordinates and `i` is a loop index: those are the right names, not lazy ones.
  # Every other single-letter name was renamed.
  excluded: [x, y, i]

type_name:
  max_length: 45

line_length:
  warning: 120
  error: 140
  ignores_comments: false

excluded:
  - .build
  - build
  # One-shot generator that is not distributed: it draws the icon and exits. Linting it forces
  # naming `l` as `side` in drawing arithmetic, where short letters are the readable choice.
  - Tools
